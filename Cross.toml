# The cross driver is pinned separately in the release workflow. Pinning these
# image manifests prevents that fixed driver from resolving its mutable `main`
# image tags during release builds.
#
# The pre-build hook builds a static OpenSSL for the musl targets.
#
# Why it is needed: `native-tls` is an unconditional dependency of the vendored
# hbb_common — `src/proxy.rs` uses tokio_native_tls and both tungstenite crates
# enable the feature — so openssl-sys is in the graph even though the server's own
# TLS is rustls. These images ship the musl toolchain and nothing else; `musl.sh`
# has no reference to openssl, so there is nothing for OPENSSL_DIR to point at.
#
# Why a hook rather than a Cargo feature: three attempts at solving this in the
# manifest each failed on CI while working locally, because the container's cargo
# resolves its own graph.
#
#   * `[target.'cfg(target_env = "musl")'.dependencies]` with `vendored` —
#     `cargo tree --target ... -e features` showed the feature, but the build
#     reported "could not find system library 'openssl'" and never compiled
#     openssl-src.
#   * the explicit triples — same outcome.
#   * an unconditional dependency relying on feature unification — same outcome;
#     the log shows `/target/release/build/openssl-sys-...` with no triple
#     directory, so the scoping never applied where it mattered.
#
# The hook installs perl and make first, which is the specific reason the earlier
# `vendored` attempts could not have succeeded here even if the feature had
# arrived: the image has no perl, and OpenSSL's Configure requires it.
# cross does not pass the calling shell's environment into the container by
# default, so the two variables the hook's OpenSSL needs must be named here.
[build.env]
passthrough = ["OPENSSL_DIR", "OPENSSL_STATIC"]

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:d54fdde7f1b680901a0bb21a2952e4921172b94c17e48603ccbbaeca8b5ef7e8"
# The hook builds OpenSSL; OPENSSL_DIR is set by the workflow's step env,
# because each pre-build entry is its own shell and an export cannot cross them.
pre-build = ["bash deploy/cross/musl-openssl.sh"]

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:f604e399cbb2154ddeb013db99eb4f123d24f09a579c7e8d6ed631d15ffa8b12"
# The hook builds OpenSSL; OPENSSL_DIR is set by the workflow's step env,
# because each pre-build entry is its own shell and an export cannot cross them.
pre-build = ["bash deploy/cross/musl-openssl.sh"]
