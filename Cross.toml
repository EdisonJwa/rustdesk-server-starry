# The cross driver is pinned separately in the release workflow. Pinning these
# image manifests prevents that fixed driver from resolving its mutable `main`
# image tags during release builds.
#
# The pre-build hook installs a static OpenSSL for the musl targets.
#
# Why it is needed: `native-tls` is an unconditional dependency of the vendored
# hbb_common — `src/proxy.rs` uses tokio_native_tls and both tungstenite crates
# enable the feature — so openssl-sys is in the graph even though the server's own
# TLS is rustls. These images ship the musl toolchain and nothing else; `musl.sh`
# has no reference to openssl, so there is nothing for OPENSSL_DIR to point at.
#
# Why the hook rather than a Cargo feature: three manifest approaches were each
# ignored by the container's cargo while working locally —
# `[target.'cfg(target_env = "musl")'.dependencies]` with `vendored`, the same
# with explicit triples, and an unconditional dependency relying on feature
# unification. The log for the last one shows a build path with no triple
# directory, and `openssl-src` never compiled.
#
# Why the OpenSSL build is inline rather than a script in the repo: `pre-build`
# entries become RUN steps in a generated Dockerfile whose build context is that
# Dockerfile alone. A path like deploy/cross/... does not exist there yet and
# fails with "No such file or directory" and exit 127. The project is mounted
# later, for the cargo invocation.
#
# The image also installs no perl, and OpenSSL's Configure requires it, which is
# the second reason the earlier `vendored` attempts could not have succeeded
# inside it.

[build.env]
# cross does not forward the calling shell's environment, so the two variables
# the OpenSSL build needs must be named here. The workflow sets their values.
passthrough = ["OPENSSL_DIR", "OPENSSL_STATIC"]

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:d54fdde7f1b680901a0bb21a2952e4921172b94c17e48603ccbbaeca8b5ef7e8"
pre-build = [
  """set -e
export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
apt-get install -y -qq --no-install-recommends perl make ca-certificates curl >/dev/null
mkdir -p /tmp/openssl-build
cd /tmp/openssl-build
curl -fsSL https://www.openssl.org/source/openssl-3.3.2.tar.gz -o openssl.tar.gz
mkdir -p src
tar -xzf openssl.tar.gz -C src --strip-components=1
cd src
CC=x86_64-linux-musl-gcc ./Configure linux-x86_64 no-shared no-tests no-legacy --prefix=/opt/musl-openssl --openssldir=/opt/musl-openssl/ssl
make -j"$(nproc)" build_libs >/dev/null
make install_sw >/dev/null
test -d /opt/musl-openssl/lib
echo 'static OpenSSL 3.3.2 installed under /opt/musl-openssl'
""",
]

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:f604e399cbb2154ddeb013db99eb4f123d24f09a579c7e8d6ed631d15ffa8b12"
pre-build = [
  """set -e
export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
apt-get install -y -qq --no-install-recommends perl make ca-certificates curl >/dev/null
mkdir -p /tmp/openssl-build
cd /tmp/openssl-build
curl -fsSL https://www.openssl.org/source/openssl-3.3.2.tar.gz -o openssl.tar.gz
mkdir -p src
tar -xzf openssl.tar.gz -C src --strip-components=1
cd src
CC=aarch64-linux-musl-gcc ./Configure linux-aarch64 no-shared no-tests no-legacy --prefix=/opt/musl-openssl --openssldir=/opt/musl-openssl/ssl
make -j"$(nproc)" build_libs >/dev/null
make install_sw >/dev/null
test -d /opt/musl-openssl/lib
echo 'static OpenSSL 3.3.2 installed under /opt/musl-openssl'
""",
]
