syntax = "proto3";
package hbb;

message IdPk {
  string id = 1;
  bytes pk = 2;
  // DTLS certificate fingerprint of the signer's WebRTC endpoint, signed together with id/pk so
  // a WebRTC peer's DTLS channel can be bound to its verified identity (defeats a rendezvous/relay
  // that swaps SDP fingerprints). Empty for non-WebRTC handshakes.
  string dtls_fingerprint = 3;
  // Newest key exchange version the signer speaks; absent, i.e. 0, is the original scheme.
  uint32 kx_version = 4;
}

message RegisterPeer {
  string id = 1;
  int32 serial = 2;
  uint64 route_generation = 60;
  uint64 activation_epoch = 61;
  bytes route_lease = 62;
  bytes activation_id = 63;
}

enum ConnType {
  DEFAULT_CONN = 0;
  FILE_TRANSFER = 1;
  PORT_FORWARD = 2;
  RDP = 3;
  VIEW_CAMERA = 4;
  TERMINAL = 5;
}

message RegisterPeerResponse { bool request_pk = 2; }

message PunchHoleRequest { 
  string id = 1; 
  NatType nat_type = 2;
  string licence_key = 3;
  ConnType conn_type = 4;
  string token = 5;
  string version = 6;
  int32 udp_port = 7;
  bool force_relay = 8;
  int32 upnp_port = 9;
  bytes socket_addr_v6 = 10;
  string switch_code = 11;
  // The offer's envelope declares its own ICE transport policy (`ice_policy` key inside
  // the webrtc:// payload): under force_relay it tells the peer whether the relay is
  // transport-forced (WebSocket — answer may use full ICE) or policy (Relay-only + TURN).
  string webrtc_sdp_offer = 12;
  uint32 relay_quality_protocol = 100;
}

message ControlPermissions {
  enum Permission {
    keyboard = 0;
    remote_printer = 1;
    clipboard = 2;
    file = 3;
    audio = 4;
    camera = 5;
    terminal = 6;
    tunnel = 7;
    restart = 8;
    recording = 9;
    block_input = 10;
    remote_modify = 11;
    privacy_mode = 12;
    usb = 13;
  }
  uint64 permissions = 1;
}

message ControlledContext {
  string conn_audit_ref = 1;
}

message PunchHole {
  bytes socket_addr = 1;
  string relay_server = 2;
  NatType nat_type = 3;
  int32 udp_port = 4;
  bool force_relay = 5;
  int32 upnp_port = 6;
  bytes socket_addr_v6 = 7;
  ControlPermissions control_permissions = 8;
  ControlledContext controlled_context = 9;
  string webrtc_sdp_offer = 10;
  RelayQualityOffer relay_quality_offer = 100;
}

message TestNatRequest {
  int32 serial = 1;
}

// per my test, uint/int has no difference in encoding, int not good for negative, use sint for negative
message TestNatResponse {
  int32 port = 1; 
  ConfigUpdate cu = 2; // for mobile
}

enum NatType {
  UNKNOWN_NAT = 0;
  ASYMMETRIC = 1;
  SYMMETRIC = 2;
}

message PunchHoleSent {
  bytes socket_addr = 1;
  string id = 2;
  string relay_server = 3;
  NatType nat_type = 4;
  string version = 5;
  int32 upnp_port = 6;
  bytes socket_addr_v6 = 7;
  string webrtc_sdp_answer = 8;
  RelayProbeReport relay_quality_report = 100;
}

message RegisterPk {
  string id = 1;
  bytes uuid = 2;
  bytes pk = 3;
  string old_id = 4;
  bool no_register_device = 5;
  uint64 activation_epoch = 61;
  bytes activation_id = 63;
}

message RegisterPkResponse {
  enum Result {
    OK = 0;
    UUID_MISMATCH = 2;
    ID_EXISTS = 3;
    TOO_FREQUENT = 4;
    INVALID_ID_FORMAT = 5;
    NOT_SUPPORT = 6;
    SERVER_ERROR = 7;
    NOT_DEPLOYED = 8;
  }
  Result result = 1;
  int32 keep_alive = 2;
  uint64 route_generation = 60;
  uint64 activation_epoch = 61;
  bytes route_lease = 62;
  bytes activation_id = 63;
}

message PunchHoleResponse {
  bytes socket_addr = 1;
  bytes pk = 2;
  enum Failure {
    ID_NOT_EXIST = 0;
    OFFLINE = 2;
    LICENSE_MISMATCH = 3;
    LICENSE_OVERUSE = 4;
  }
  Failure failure = 3;
  string relay_server = 4;
  oneof union {
    NatType nat_type = 5;
    bool is_local = 6;
  }
  string other_failure = 7;
  int32 feedback = 8;
  bool is_udp = 9;
  int32 upnp_port = 10;
  bytes socket_addr_v6 = 11;
  string webrtc_sdp_answer = 12;
  RelayQualityOffer relay_quality_offer = 100;
  RelayProbeReport relay_quality_peer_report = 101;
  RelayQualityDecision relay_quality_decision = 102;
}

message ConfigUpdate {
  int32 serial = 1;
  repeated string rendezvous_servers = 2;
}

message RequestRelay {
  string id = 1;
  string uuid = 2;
  bytes socket_addr = 3;
  string relay_server = 4;
  bool secure = 5;
  string licence_key = 6;
  ConnType conn_type = 7;
  string token = 8;
  ControlPermissions control_permissions = 9;
  ControlledContext controlled_context = 10;
  string switch_code = 11;
  RelayProbeReport relay_quality_report = 100;
  RelayQualityDecision relay_quality_decision = 101;
  bytes relay_quality_allocation_id = 102;
  bytes fast_relay_authorization = 64;
}

message RelayResponse {
  bytes socket_addr = 1;
  string uuid = 2;
  string relay_server = 3;
  oneof union {
    string id = 4;
    bytes pk = 5;
  }
  string refuse_reason = 6;
  string version = 7;
  int32 feedback = 9;
  bytes socket_addr_v6 = 10;
  int32 upnp_port = 11;
  string webrtc_sdp_answer = 12;
  RelayProbeReport relay_quality_report = 100;
  RelayQualityDecision relay_quality_decision = 101;
  bytes fast_relay_authorization = 64;
}

message SoftwareUpdate { string url = 1; }

// if in same intranet, punch hole won't work both for udp and tcp,
// even some router has below connection error if we connect itself,
//  { kind: Other, error: "could not resolve to any address" },
// so we request local address to connect.
message FetchLocalAddr {
  bytes socket_addr = 1;
  string relay_server = 2;
  bytes socket_addr_v6 = 3;
  ControlPermissions control_permissions = 4;
  ControlledContext controlled_context = 5;
  RelayQualityOffer relay_quality_offer = 100;
}

message LocalAddr {
  bytes socket_addr = 1;
  bytes local_addr = 2;
  string relay_server = 3;
  string id = 4;
  string version = 5;
  bytes socket_addr_v6 = 6;
  RelayProbeReport relay_quality_report = 100;
}

message PeerDiscovery {
  string cmd = 1;
  string mac = 2;
  string id = 3;
  string username = 4;
  string hostname = 5;
  string platform = 6;
  string misc = 7;
}

message OnlineRequest {
  string id = 1;
  repeated string peers = 2;
}

message OnlineResponse {
  bytes states = 1;
}

message KeyExchange {
  repeated bytes keys = 1; 
  // From the server: the newest key exchange version it speaks. From the client: the version it
  // picked, the highest both speak. Absent, i.e. 0, is the original scheme.
  uint32 version = 2;
  // Server signature of KxParams. Bit 255 of the signed X25519 public key requires this field;
  // legacy keys leave it clear.
  bytes signed_params = 3;
}

// Signed by the server beside its ephemeral public key: that key as it went out, so the signature
// belongs to this exchange alone, and the newest key exchange version the server speaks.
message KxParams {
  bytes pk = 1;
  uint32 version = 2;
}

message HealthCheck {
  string token = 1;
}

message HeaderEntry {
  string name = 1;
  string value = 2;
}

message HttpProxyRequest {
  string method = 1;
  string path = 2;
  repeated HeaderEntry headers = 3;
  bytes body = 4;
}

message HttpProxyResponse {
  int32 status = 1;
  repeated HeaderEntry headers = 2;
  bytes body = 3;
  string error = 4;
}

message IceCandidate {
  string id = 1;
  bytes socket_addr = 2;
  string session_key = 3;
  string candidate = 4;
}

message StarryRelayLoad {
  uint32 load_basis_points = 1;
  uint32 active_sessions = 2;
  uint32 capacity_sessions = 3;
  uint64 bandwidth_bps = 4;
  uint64 capacity_bandwidth_bps = 5;
}

message RelayProbeRequest {
  uint32 protocol_version = 1;
  bytes nonce = 2;
}

message RelayProbeResponse {
  uint32 protocol_version = 1;
  bytes nonce = 2;
  // Retained only for wire compatibility with pre-release v1 implementations.
  // HBBR MUST leave this unset; detailed load is authenticated telemetry only.
  StarryRelayLoad load = 3;
  string starry_version = 4;
  // Explicit machine-readable capabilities. Never infer these from
  // starry_version; zero means unsupported/legacy.
  uint32 relay_probe_protocol = 5;
  uint32 relay_load_protocol = 6;
}

message RelayQualityWeights {
  uint32 rtt = 1;
  uint32 jitter = 2;
  uint32 loss = 3;
  uint32 load = 4;
}

message RelayQualityCandidate {
  string relay_server = 1;
  string probe_url = 2;
  StarryRelayLoad load = 3;
  uint32 server_rtt_ms = 4;
  uint64 observed_at_unix_ms = 5;
}

message RelayQualityOffer {
  uint32 protocol_version = 1;
  bytes allocation_id = 2;
  string fallback_relay = 3;
  repeated RelayQualityCandidate candidates = 4;
  RelayQualityWeights weights = 5;
  uint32 probe_samples = 6;
  uint32 probe_interval_ms = 7;
  uint32 report_timeout_ms = 8;
  uint32 probe_timeout_ms = 9;
  // Stable numeric values: 1=adaptive, 2=eager.
  uint32 strategy = 10;
  // Stable numeric values: 1=primary, 2=expanded, 3=eager.
  uint32 stage = 11;
  // Fresh 16-byte server token. Reports MUST echo the token for this stage.
  bytes stage_token = 12;
  uint64 stage_deadline_unix_ms = 13;
  uint64 total_deadline_unix_ms = 14;
  string primary_relay = 15;
  // Applied only to the primary stage. Eager offers set this to zero.
  uint32 p2p_probe_grace_ms = 16;
}

message RelayProbeResult {
  string relay_server = 1;
  uint32 attempted = 2;
  uint32 succeeded = 3;
  uint32 rtt_ms = 4;
  uint32 jitter_ms = 5;
}

message RelayProbeReport {
  uint32 protocol_version = 1;
  bytes allocation_id = 2;
  repeated RelayProbeResult results = 3;
  // Must match the issued offer. Values are defined above.
  uint32 stage = 4;
  bytes stage_token = 5;
  // Stable numeric values: 1=controller, 2=target.
  uint32 endpoint_role = 6;
}

message RelayQualityScore {
  string relay_server = 1;
  uint32 score = 2;
  uint32 rtt_penalty = 3;
  uint32 jitter_penalty = 4;
  uint32 loss_penalty = 5;
  uint32 load_penalty = 6;
  uint32 missing_reports = 7;
}

message RelayQualityDecision {
  uint32 protocol_version = 1;
  bytes allocation_id = 2;
  string relay_server = 3;
  repeated RelayQualityScore scores = 4;
  // Pre-freeze placeholder retained at its original tag. Frozen v1 senders
  // MUST leave it empty and clients MUST NOT display it.
  string reason = 5 [deprecated = true];
  bool fallback = 6;
  // Stable numeric values: 1=primary_accepted, 2=expanded_best_score,
  // 3=partial, 4=hysteresis, 5=legacy_fallback, 6=probe_failure,
  // 7=manual_override.
  uint32 reason_code = 7;
  // The terminal measurement stage: 1=primary, 2=expanded, 3=eager.
  uint32 stage = 8;
  bool partial = 9;
}

message RelayQualityCancel {
  uint32 protocol_version = 1;
  bytes allocation_id = 2;
  uint32 stage = 3;
  bytes stage_token = 4;
  // Stable numeric values: 1=p2p_succeeded, 2=client_abort.
  uint32 reason_code = 5;
  // Stable numeric values: 1=controller, 2=target.
  uint32 endpoint_role = 6;
}

message FastRelayAuthorization {
  uint32 version = 1;
  string session_uuid = 2;
  uint64 expires_at = 3;
  bool allow_fast_compat = 4;
  bool allow_fast_media_v1 = 5;
  uint32 max_bitrate_kbps = 6;
  uint32 relay_udp_protocol = 7;
  string relay_server = 8;
  uint32 relay_udp_port = 9;
  bytes relay_allocation_id = 10;
  uint32 relay_max_datagram = 11;
  // Stable values: 1=controller, 2=target.
  uint32 relay_endpoint_role = 12;
}

message DeactivatePeer {
  string id = 1;
  bytes network_identity_uuid = 2;
  uint64 activation_epoch = 3;
  bytes activation_id = 4;
  bytes route_lease = 5;
  uint64 route_generation = 6;
}

message DeactivatePeerResponse {
  uint64 activation_epoch = 1;
  bytes activation_id = 2;
  bool deactivated = 3;
  uint64 route_generation = 4;
}

message RendezvousMessage {
  oneof union {
    RegisterPeer register_peer = 6;
    RegisterPeerResponse register_peer_response = 7;
    PunchHoleRequest punch_hole_request = 8;
    PunchHole punch_hole = 9;
    PunchHoleSent punch_hole_sent = 10;
    PunchHoleResponse punch_hole_response = 11;
    FetchLocalAddr fetch_local_addr = 12;
    LocalAddr local_addr = 13;
    ConfigUpdate configure_update = 14;
    RegisterPk register_pk = 15;
    RegisterPkResponse register_pk_response = 16;
    SoftwareUpdate software_update = 17;
    RequestRelay request_relay = 18;
    RelayResponse relay_response = 19;
    TestNatRequest test_nat_request = 20;
    TestNatResponse test_nat_response = 21;
    PeerDiscovery peer_discovery = 22;
    OnlineRequest online_request = 23;
    OnlineResponse online_response = 24;
    KeyExchange key_exchange = 25;
    HealthCheck hc = 26;
    HttpProxyRequest http_proxy_request = 27;
    HttpProxyResponse http_proxy_response = 28;
    IceCandidate ice_candidate = 29;
    RelayProbeRequest relay_probe_request = 100;
    RelayProbeResponse relay_probe_response = 101;
    RelayProbeReport relay_quality_stage_report = 102;
    RelayQualityOffer relay_quality_stage_offer = 103;
    RelayQualityDecision relay_quality_stage_decision = 104;
    RelayQualityCancel relay_quality_cancel = 105;
    DeactivatePeer deactivate_peer = 62;
    DeactivatePeerResponse deactivate_peer_response = 63;
  }
}
