    app.kubernetes.io/component: hbbr
spec:
  accessModes:
    {{- toYaml .Values.hbbr.persistence.accessModes | nindent 4 }}
  {{- with .Values.hbbr.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.hbbr.persistence.size }}
{{- end }}
