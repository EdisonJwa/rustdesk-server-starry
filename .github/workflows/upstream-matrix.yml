name: Upstream compatibility matrix

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

concurrency:
  group: starry-upstream-matrix
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  metadata:
    name: Resolve the upstream bases under test
    runs-on: ubuntu-24.04
    outputs:
      bases: ${{ steps.bases.outputs.bases }}
    steps:
      - name: Resolve the latest formal release and the current master
        id: bases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/rustdesk/rustdesk-server/releases/latest --jq .tag_name)"
          {
            echo 'bases=['
            echo "  {\"name\": \"release\", \"ref\": \"${latest}\"},"
            echo '  {"name": "master", "ref": "master"}'
            echo ']'
          } >> "$GITHUB_OUTPUT"

  overlay:
    name: Overlay applies to ${{ matrix.base.name }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.metadata.outputs.bases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the overlay and workflow inputs
        run: |
          set -euo pipefail
          python3 scripts/check_contracts.py
          python3 scripts/check_docs.py
          python3 scripts/check_workflows.py

      - name: Fetch the exact upstream base
        id: upstream
        env:
          UPSTREAM_REF: ${{ matrix.base.ref }}
        run: |
          set -euo pipefail
          git init _upstream
          git -C _upstream remote add origin https://github.com/rustdesk/rustdesk-server.git
          git -C _upstream fetch --depth 1 origin "${UPSTREAM_REF}"
          git -C _upstream checkout --detach "$(git -C _upstream rev-parse FETCH_HEAD)"
          git -C _upstream submodule update --init --recursive --depth 1
          {
            echo "commit=$(git -C _upstream rev-parse HEAD)"
            echo "hbb_common=$(git -C _upstream/libs/hbb_common rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Apply the overlay twice and require an idempotent result
        run: |
          set -euo pipefail
          python3 scripts/apply_overlay.py _upstream
          first_digest="$({
            find _upstream/src _upstream/tests _upstream/contracts \
              _upstream/libs/hbb_common/protos _upstream/PATCH_VERSION \
              _upstream/libs/hbb_common/src _upstream/Cargo.toml \
              _upstream/Cargo.lock _upstream/Cross.toml \
              _upstream/libs/hbb_common/Cargo.toml \
              -type f ! -name version.rs -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          } | sha256sum | cut -d' ' -f1)"
          python3 scripts/apply_overlay.py _upstream
          second_digest="$({
            find _upstream/src _upstream/tests _upstream/contracts \
              _upstream/libs/hbb_common/protos _upstream/PATCH_VERSION \
              _upstream/libs/hbb_common/src _upstream/Cargo.toml \
              _upstream/Cargo.lock _upstream/Cross.toml \
              _upstream/libs/hbb_common/Cargo.toml \
              -type f ! -name version.rs -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          } | sha256sum | cut -d' ' -f1)"
          test "$first_digest" = "$second_digest"
          git -C _upstream diff --check
          echo "overlay is idempotent on ${{ matrix.base.name }} (${{ matrix.base.ref }})"

      - name: Report an upstream base that needs a new reviewed lock
        if: matrix.base.name != 'release'
        run: |
          set -euo pipefail
          if cmp -s overlay/Cargo.lock _upstream/Cargo.lock; then
            echo "The reviewed Cargo.lock also satisfies ${{ matrix.base.ref }}."
          else
            echo "::warning title=Cargo.lock is release-pinned::The reviewed \
          Cargo.lock targets the current formal release and does not match \
          ${{ matrix.base.ref }}. That is expected between releases: regenerate \
          the lock when upstream cuts the next tag. Anchors and idempotence \
          above already passed, so only the dependency graph differs."
          fi

      - name: Check the patched graph compiles on the release base
        if: matrix.base.name == 'release'
        run: |
          set -euo pipefail
          cmp overlay/Cargo.lock _upstream/Cargo.lock
          cargo check --manifest-path _upstream/Cargo.toml --workspace --locked

      - name: Run the full test suite on the release base
        if: matrix.base.name == 'release'
        run: |
          cargo test --manifest-path _upstream/Cargo.toml --locked

      - name: Lint every target on the release base
        if: matrix.base.name == 'release'
        run: |
          cargo clippy --manifest-path _upstream/Cargo.toml --locked --all-targets -j 1

      - name: Build binaries on the release base
        if: matrix.base.name == 'release'
        run: |
          cargo check --manifest-path _upstream/Cargo.toml --locked --bins
